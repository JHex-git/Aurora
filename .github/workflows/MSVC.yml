name: MSVC CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: Install shaderc via vcpkg
      shell: pwsh
      run: |
        git clone https://github.com/microsoft/vcpkg "$env:GITHUB_WORKSPACE/vcpkg"
        & "$env:GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.bat"
        & "$env:GITHUB_WORKSPACE/vcpkg/vcpkg" install shaderc --triplet x64-windows
        "CMAKE_PREFIX_PATH=$env:GITHUB_WORKSPACE\vcpkg\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Build-MSVC
      run: ./MSVC_build.bat
